name: academia_events
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0

  # Mapas
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # QR
  qr_flutter: ^4.1.0

  # Backend
  supabase_flutter: ^2.17.1
  flutter_dotenv: ^6.0.1

  # Estado — Riverpod
  flutter_riverpod: ^3.4.2
  riverpod_annotation: ^4.0.6
  equatable: ^2.0.5

  # Navegación
  go_router: ^17.5.0

  # Modelos inmutables
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Utilidades
  image_picker: ^1.2.0
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^13.3.0
  screenshot: ^3.0.0
  path_provider: ^2.1.6
  mobile_scanner: 7.1.1
  fl_chart: ^1.2.0
  excel: ^4.0.6
  file_picker: ^13.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generador de íconos de aplicación
  flutter_launcher_icons: ^0.14.3

  # Generadores de código
  build_runner: ^2.4.13
  freezed: ^4.0.0-dev.3
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.8

# Configuración del generador de íconos
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#0E0B16"
  adaptive_icon_foreground: "assets/icon/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/logo.jpg